[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "1.0.0"
description = "Bot modular de trading de criptomonedas con backtesting, gestión de riesgo, panel web y alertas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "ccxt>=4.2",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.3", "mypy>=1.9"]
fast = ["uvloop>=0.19"]

[project.scripts]
trading-bot = "bot.cli:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
"bot.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:bot.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # la longitud la controla el formateador
    "RUF001",  # caracteres unicode ambiguos: los comentarios están en español
    "RUF002",
    "RUF003",
    # Métodos vacíos en clases abstractas: son ganchos OPCIONALES a propósito
    # (Broker.close, Notifier.close, Strategy.validate_params). Marcarlos como
    # abstractos obligaría a implementarlos en clases que no los necesitan.
    "B027",
    # Nombres de excepción sin sufijo "Error": InsufficientFunds y OrderRejected
    # se leen mucho mejor así, y describen situaciones de negocio, no fallos.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
